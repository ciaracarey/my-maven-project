name: Java CI and Deploy to Cloudsmith

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write   # Required for OIDC token exchange with Cloudsmith

env:
  CLOUDSMITH_ORG: globex-innovations
  # Must match the repo in pom.xml distributionManagement
  CLOUDSMITH_REPO: maven-test2
  SERVICE: ci_acme_service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out the code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2) Set up Java 11 – use v4, v2 is deprecated
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      # 3) Clear local Maven cache (cold-fetch to prove all deps resolve via Cloudsmith)
      - name: Clear Maven cache
        run: rm -rf ~/.m2/repository/*

      # 4a) Exchange GitHub OIDC token for a Cloudsmith ephemeral API key.
      #     The action writes CLOUDSMITH_API_KEY into $GITHUB_ENV automatically.
      - name: Auth to Cloudsmith with OIDC
        uses: cloudsmith-io/cloudsmith-cli-action@v1.0.2
        with:
          oidc-namespace: ${{ env.CLOUDSMITH_ORG }}
          oidc-service-slug: ${{ env.SERVICE }}
          oidc-auth-only: 'true'
          pip-install: false

      # 4b) Write Maven settings.
      #     Mirror uses dl.cloudsmith.io (download URL) – using maven.cloudsmith.io
      #     adds a redirect on every request and slows cold fetches noticeably.
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>cloudsmith</id>
                <username>${{ env.SERVICE }}</username>
                <password>${CLOUDSMITH_API_KEY}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>cloudsmith</id>
                <name>Cloudsmith proxy cache</name>
                <!-- dl.cloudsmith.io = direct download, no redirect overhead -->
                <url>https://dl.cloudsmith.io/basic/${{ env.CLOUDSMITH_ORG }}/${{ env.CLOUDSMITH_REPO }}/maven/</url>
                <mirrorOf>external:*</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF
        env:
          # Wire the ephemeral key written by the OIDC step into this shell env
          CLOUDSMITH_API_KEY: ${{ env.CLOUDSMITH_API_KEY }}

      # Debug: verify settings look correct (remove before going to production)
      #- name: Debug – show Maven settings
      #  run: cat ~/.m2/settings.xml

      #- name: Test Maven cold fetch
      #  run: mvn -Daether.transport.http.requestTimeout=600000 test --settings ~/.m2/settings.xml

      #- name: Build
      #  run: mvn package -DskipTests --settings ~/.m2/settings.xml -U

      #- name: Build
      #  run: mvn package -Dmaven.test.skip=true --settings ~/.m2/settings.xml -U
      - name: Build
        run: mvn package \
          -Dmaven.test.skip=true \
          -Daether.transport.http.connectTimeout=60000 \
          -Daether.transport.http.readTimeout=600000 \
          --settings ~/.m2/settings.xml \
          -U
                   
      # 5) Compile and run tests
        #- name: Test
         # run: mvn test --settings ~/.m2/settings.xml -U


      # 6) Full build (package) – only runs after tests pass
      #- name: Build
      #  run: mvn clean package -DskipTests --settings ~/.m2/settings.xml

      # 7) Deploy to Cloudsmith (only on pushes to main, not on PRs)
      #- name: Deploy
      #  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #  run: mvn deploy -DskipTests --settings ~/.m2/settings.xml
        
